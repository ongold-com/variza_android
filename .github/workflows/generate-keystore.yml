name: Generate signing key (run once)

on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create keystore
        run: |
          PASS=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)
          keytool -genkeypair -keystore variza.jks -alias variza -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Variza SMS Forwarder, O=Variza, C=IR"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=variza"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64=$(base64 -w0 variza.jks)"
          } > signing-secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: signing-secrets.txt
          retention-days: 1
